[project]
name = "steward"
version = "1.0.0"
description = "Per-action authorization, obligations and tamper-evident audit for LLM agents on the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohil Ahuja" }]
keywords = ["mcp", "model-context-protocol", "llm", "agent", "authorization", "security", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  # The evaluation harness and the detector are part of the product, not an
  # optional extra: `steward eval` and `steward detector train` are the two
  # commands that produce this project's headline results.
  "numpy>=1.26",
]

[project.optional-dependencies]
# Live mode: drive a real Claude agent and LLM judge instead of the
# deterministic harness. Deliberately optional so the published numbers are
# reproducible with no API key and no spend.
live = ["anthropic>=0.40"]
postgres = ["asyncpg>=0.29,<1"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
steward = "steward.cli:main"

[project.urls]
Homepage = "https://github.com/mohilahuja/steward"
Issues = "https://github.com/mohilahuja/steward/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steward*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # long lines are handled by the formatter, not the linter
  "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
