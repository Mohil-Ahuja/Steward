services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward -d steward"]
  steward:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://steward:steward@postgres:5432/steward
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

